name: TFTMeta
options:
  bundleIdPrefix: gg.opgg.tft
  deploymentTarget:
    iOS: "17.0"
  createGroupSynced: false
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
targets:
  TFTMeta:
    type: application
    platform: iOS
    sources:
      - path: App
        # The pre-multi-language capture. Kept on disk for the .rea scripts, but every locale now
        # ships its own file, so it must not ride along in the bundle.
        excludes:
          - "Resources/tft-set18.json"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: OP.GG TFT
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: gg.opgg.tft.TFTMeta
        TARGETED_DEVICE_FAMILY: "1,2"
        # The Xcode-set team lives in the generated project, so regeneration has to carry it.
        DEVELOPMENT_TEAM: RV2GXBQQP2
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: iPhone Developer
